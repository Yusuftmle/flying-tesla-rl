<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAC Ball & Plate AI | 120Hz Neural Physics & Training Reels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

  <div id="viewport-wrapper">
    
    <div class="top-mode-bar">
      <button id="tab-reels" class="btn-tab active" onclick="switchMainMode('reels')">
        🎬 0-500 EĞİTİM REELS
      </button>
      <button id="tab-arena" class="btn-tab arena-tab" onclick="switchMainMode('arena')">
        🎮 CANLI TEST ARENASI
      </button>
    </div>

    <canvas id="master-canvas" width="1080" height="1920"></canvas>
    <canvas id="three-canvas" width="1080" height="1920"></canvas>

    <div id="rec-indicator">
      <span class="rec-dot"></span>
      <span id="rec-time-text">REC 00:00</span>
    </div>

    <div id="toast">500 Adımlık Model Yükleniyor...</div>

    <div class="controls-overlay">
      <div class="dock-panel">
        
        <!-- REELS MODU KONTROLLERİ -->
        <div id="reels-controls-group" style="display: flex; flex-direction: column; gap: 7px;">
          <div class="action-row">
            <button id="btn-record-reel" class="btn-record" onclick="handleRecordClick()" title="1080x1920 Reels videosu kaydeder">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9"></circle></svg>
              <span id="rec-btn-text">🎬 REELS VİDEOSU KAYDET</span>
            </button>
            <button id="btn-mode-toggle" class="btn-chip active" style="flex:1.1; color: #000; background: #fbbf24;" onclick="handleTimelineToggle()" title="500 adımlık eğitim sürecini oynatır">
              ⚡ 0-500 AKIŞI
            </button>
            <button id="btn-play-pause" class="btn-chip" style="flex:0.6;" onclick="handlePlayPauseClick()">DURAKLAT</button>
            <button id="btn-sound-toggle" class="btn-chip" style="flex:0.6;" onclick="handleSoundClick()">SES: AÇIK</button>
          </div>

          <div class="stage-row">
            <button id="btn-step-0" class="btn-chip" onclick="handleStepClick(0)">0 Adım</button>
            <button id="btn-step-100" class="btn-chip" onclick="handleStepClick(100)">100 Adım</button>
            <button id="btn-step-250" class="btn-chip" onclick="handleStepClick(250)">250 Adım</button>
            <button id="btn-step-400" class="btn-chip" onclick="handleStepClick(400)">400 Adım</button>
            <button id="btn-step-500" class="btn-chip" onclick="handleStepClick(500)">500 (Denge)</button>
          </div>

          <div class="timeline-row">
            <span>Kare:</span>
            <input type="range" id="slider-frame" min="0" max="599" value="0" oninput="handleSliderInput(this.value)">
            <span id="frame-label" style="min-width: 65px; text-align: right;">1 / 600</span>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="./lib/three.min.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
